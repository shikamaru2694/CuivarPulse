# Builds and publishes a release when a version tag is pushed (e.g. v1.1.0).
# The ZIP is built here on GitHub from the tagged commit, never on a laptop, and
# GitHub signs a build provenance attestation for it: proof of which commit and
# workflow produced it. Check one with:
#   gh attestation verify CuivarPulse.zip --repo shikamaru2694/CuivarPulse
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tools
        run: npm ci

      - name: Build the ZIP from this commit
        run: python3 scripts/package.py --tag "$GITHUB_REF_NAME"

      - name: Exactly one plugin ZIP
        run: |
          count=$(ls out/*.zip | wc -l)
          [ "$count" -eq 1 ] || { echo "expected 1 ZIP, found $count"; exit 1; }
          cat out/SHA256SUMS

      - name: Attest where the ZIP came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" out/*.zip out/SHA256SUMS \
            --title "Cuivar Pulse ${GITHUB_REF_NAME#v}" --notes-file "$notes"
